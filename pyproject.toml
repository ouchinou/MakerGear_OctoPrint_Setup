[project]
name = "makergear-octoprint-setup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "autopep8>=2.3.2",
    "modernize>=0.8.0",
    "pyupgrade>=3.21.1",
]

[tool.uv.sources]
pyupgrade = { index = "jfrog" }
modernize = { index = "jfrog" }
autopep8 = { index = "jfrog" }

[[tool.uv.index]]
name = "jfrog"
url = "https://cochlear.jfrog.io/artifactory/api/pypi/coh-esw-pip/simple"
default = true
